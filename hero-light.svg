<svg width="1180" height="520" viewBox="0 0 1180 520" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'SFMono-Regular','Cascadia Code','JetBrains Mono',ui-monospace,monospace">
  <defs>
